@if (producto; as item) {
  <article class="tarjeta-producto">
    @if (posicion > 0) {
      <span class="posicion">{{ textoPosicion() }}</span>
    }
    <a class="imagen" [routerLink]="['/producto', item.id]" tabindex="-1" aria-hidden="true">
      <img [src]="item.imagen" alt="" width="500" height="375" loading="lazy">
    </a>
    <p class="meta">{{ item.categoria }} · {{ item.subcategoria }}</p>
    <h3 class="nombre">{{ item.nombre }}</h3>
    <p class="precio">{{ item.precio | precioCop }}</p>
    <div class="acciones">
      <a class="ver-detalle" [routerLink]="['/producto', item.id]">Ver detalle</a>
      <button type="button" class="agregar" [disabled]="!item.disponible" (click)="alAgregar(item)">
        <span>Agregar</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </article>
}
